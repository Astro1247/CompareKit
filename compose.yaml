services:
  app:
    image: comparekit:local
    build: .
    ports:
      - "${COMPAREKIT_BIND:-0.0.0.0}:${COMPAREKIT_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 32
    restart: unless-stopped

