name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - name: Upload standalone build
        if: github.server_url == 'https://github.com' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparekit-standalone
          path: |
            dist/
            scripts/serve.mjs
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Standard Compose
        run: |
          docker compose up --build --wait
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail --head http://127.0.0.1:8080/ | grep -i "connect-src 'none'"
          docker compose down
      - name: Isolated Compose
        run: |
          docker compose -p comparekit-isolated -f compose.hardened.yaml up --wait
          curl --fail http://127.0.0.1:8080/healthz
          test "$(docker network inspect comparekit-isolated_backend --format '{{.Internal}}')" = true
          app_id=$(docker compose -p comparekit-isolated -f compose.hardened.yaml ps -q app)
          published_ports=$(docker port "$app_id")
          test -z "$published_ports"
          routes=$(docker compose -p comparekit-isolated -f compose.hardened.yaml exec -T app ip route)
          if grep -q '^default' <<< "$routes"; then
            echo "The isolated app has a default route."
            exit 1
          fi
          if docker compose -p comparekit-isolated -f compose.hardened.yaml exec -T app wget -T 3 -q -O /dev/null http://1.1.1.1/; then
            echo "The isolated app reached an external address."
            exit 1
          fi
      - name: Clean up
        if: always()
        run: |
          docker compose down
          docker compose -p comparekit-isolated -f compose.hardened.yaml down

