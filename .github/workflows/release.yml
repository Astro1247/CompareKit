name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, such as v0.1.0
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: comparekit-release
  cancel-in-progress: false

jobs:
  release:
    if: github.server_url == 'https://github.com' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Verify package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test "$(node --input-type=module -e "import fs from 'node:fs'; console.log('v' + JSON.parse(fs.readFileSync('package.json')).version)")" = "$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Package standalone web build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tar -czf "comparekit-$TAG-web.tar.gz" dist scripts/serve.mjs
          sha256sum "comparekit-$TAG-web.tar.gz" > "comparekit-$TAG-web.tar.gz.sha256"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish OCI images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" \
            --tag "$image:$TAG" .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" "comparekit-$TAG-web.tar.gz" "comparekit-$TAG-web.tar.gz.sha256" --verify-tag --generate-notes

