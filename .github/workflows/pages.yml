name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    if: github.server_url == 'https://github.com' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check Pages publishing source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$RUNNER_TEMP/pages.json"
          status=$(curl --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$response" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              build_type=$(jq -r '.build_type' "$response")
              if [[ "$build_type" == workflow ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            404) ;;
            *)
              echo "::error::GitHub Pages settings request returned HTTP $status."
              exit 1
              ;;
          esac
          message='Enable Pages under Settings → Pages → Build and deployment → Source → GitHub Actions. Private repositories require an eligible GitHub plan.'
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::notice::Demo deployment skipped. $message"

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=Chromium pages.spec.ts
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
