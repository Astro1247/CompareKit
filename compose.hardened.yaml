services:
  app:
    image: comparekit:local
    build: .
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 32
    restart: unless-stopped
  proxy:
    image: nginx/nginx-unprivileged:1.30.8-alpine@sha256:637c35e46af7bc0dd3d3bcf7162e004e13ab3b370fde7cd416e2ac410b5a985a
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    command: []
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend, backend]
    ports:
      - "${COMPAREKIT_BIND:-127.0.0.1}:${COMPAREKIT_PORT:-8080}:8080"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 32
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
networks:
  frontend:
  backend:
    internal: true

